name: Use Secrets Example

on:
  push:
    branches:
      - main

jobs:
  secret-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show secret (masked)
        run: echo "MY_SECRET is ${{ secrets.MY_SECRET }}"

      - name: Use secret in an environment variable
        run: |
          echo "MY_SECRET=$MY_SECRET" >> $GITHUB_ENV
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}

      - name: Print secret from environment
        run: echo "MY_SECRET from env is $MY_SECRET"

      - name: Send GET request with secret
        run: curl "https://himitsu.ytkg.workers.dev?text=${{ secrets.MY_SECRET }}"
